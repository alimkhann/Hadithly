name: Hadithly
options:
  bundleIdPrefix: com.hadithly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  clerk-ios:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.0.0
  clerk-convex:
    url: https://github.com/clerk/clerk-convex-swift
    from: 0.1.0
  convex-swift:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
targets:
  Hadithly:
    type: application
    platform: iOS
    sources:
      - Hadithly
    dependencies:
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: clerk-convex
        product: ClerkConvex
      - package: convex-swift
        product: ConvexMobile
    info:
      path: Hadithly/Info.plist
      properties:
        CFBundleDisplayName: Hadithly
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ConvexURL: $(CONVEX_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
  HadithlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HadithlyTests
    dependencies:
      - target: Hadithly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Hadithly:
    build:
      targets:
        Hadithly: all
        HadithlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HadithlyTests
