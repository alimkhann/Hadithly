name: Hadithly
options:
  bundleIdPrefix: com.hadithly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.30.1
  clerk-ios:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.0.0
  clerk-convex:
    url: https://github.com/clerk/clerk-convex-swift
    from: 0.1.0
  convex-swift:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.0
  revenuecat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.90.2
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
  configs:
    Release:
      OTHER_SWIFT_FLAGS: "$(inherited) -debug-prefix-map $(HOME)=/build -file-prefix-map $(HOME)=/build"
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: false
targets:
  Hadithly:
    type: application
    platform: iOS
    sources:
      - Hadithly
    dependencies:
      - package: sentry
        product: Sentry
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: clerk-convex
        product: ClerkConvex
      - package: convex-swift
        product: ConvexMobile
      - package: revenuecat
        product: RevenueCat
      - target: HadithlyWidgets
        embed: true
    info:
      path: Hadithly/Info.plist
      properties:
        CFBundleDisplayName: Hadithly
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Amiri-Regular.ttf
          - ScheherazadeNew-Regular.ttf
          - NotoNaskhArabic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.hadithly.app
            CFBundleURLSchemes:
              - com.hadithly.app
        ConvexURL: $(CONVEX_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        TermsOfUseURL: $(TERMS_OF_USE_URL)
        DiagnosticsDSN: $(DIAGNOSTICS_DSN)
        DiagnosticsEnvironment: $(DIAGNOSTICS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: Hadithly/Hadithly.entitlements
        APP_ATTEST_ENVIRONMENT: production
        DEVELOPMENT_TEAM: 6378AFQPXV
      configs:
        Release:
          DIAGNOSTICS_ENVIRONMENT: production
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Debug:
          DIAGNOSTICS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APP_ATTEST_ENVIRONMENT: development
    configFiles:
      Debug: Secrets.xcconfig
      Release: Production.xcconfig
  HadithlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HadithlyWidgets
      - path: Hadithly/Core/Widgets/WidgetSnapshot.swift
    info:
      path: HadithlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hadithly Widgets
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app.widgets
        CODE_SIGN_ENTITLEMENTS: HadithlyWidgets/HadithlyWidgets.entitlements
        DEVELOPMENT_TEAM: 6378AFQPXV
        TARGETED_DEVICE_FAMILY: "1,2"
  HadithlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HadithlyTests
    dependencies:
      - target: Hadithly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app.tests
        GENERATE_INFOPLIST_FILE: true
  HadithlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HadithlyUITests
    dependencies:
      - target: Hadithly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hadithly.app.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6378AFQPXV
schemes:
  LA2Verification:
    build:
      targets:
        Hadithly: all
        HadithlyTests: [test]
        HadithlyUITests: [test]
    test:
      config: Debug
      targets:
        - HadithlyTests
        - HadithlyUITests
      environmentVariables:
        HADITHLY_LA2_LIVE: $(LA2_LIVE)
  Hadithly:
    build:
      targets:
        Hadithly: all
        HadithlyWidgets: all
        HadithlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HadithlyTests
  Phase4Live:
    build:
      targets:
        Hadithly: all
        HadithlyUITests: [test]
    test:
      config: Debug
      targets:
        - HadithlyUITests
