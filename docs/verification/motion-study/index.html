<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hadithly motion study</title><link rel="stylesheet" href="motion.css"></head>
<body><main><header><h1>Loading and translation motion</h1><p>A motion prototype for native SwiftUI and Compose components.</p></header>
<nav aria-label="Theme"><button data-theme-button="light">Light</button><button data-theme-button="dark">Dark</button><button data-theme-button="paper">Paper</button></nav>
<section class="card" data-state="loading" aria-busy="true"><div class="waiting" role="status"><span aria-hidden="true">✧</span><span class="thinking">AI translation…</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
<div class="content-slot"><div class="skeleton" aria-hidden="true"><b></b><b></b><b></b></div><p class="result">Read the original text and understand its meaning in your language.</p></div><p class="caption">Prepared interface example</p></section>
<button class="reveal">Reveal prepared sample</button></main>
<script>
const card=document.querySelector('.card');
for(const b of document.querySelectorAll('[data-theme-button]')) b.addEventListener('click',()=>document.documentElement.dataset.theme=b.dataset.themeButton);
document.querySelector('.reveal').addEventListener('click',()=>{const loading=card.dataset.state!=='ready';card.dataset.state=loading?'ready':'loading';card.setAttribute('aria-busy',String(!loading));document.querySelector('.reveal').textContent=loading?'Show loading state':'Reveal prepared sample'});
</script></body></html>
